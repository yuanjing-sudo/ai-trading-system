<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 220px;
            background: #0d1321;
            border-right: 1px solid #1e2a3a;
            padding: 20px 0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-brand {
            padding: 0 20px 20px;
            border-bottom: 1px solid #1e2a3a;
            margin-bottom: 16px;
        }
        .sidebar-brand h1 {
            font-size: 16px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sidebar-brand .subtitle {
            font-size: 10px;
            color: #6b7280;
            margin-top: 4px;
        }
        .nav-tab {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: #9ca3af;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .nav-tab:hover { background: rgba(0,212,255,0.05); color: #e0e0e0; }
        .nav-tab.active {
            background: rgba(0,212,255,0.1);
            color: #00d4ff;
            border-left-color: #00d4ff;
        }
        .nav-tab .icon { font-size: 18px; width: 24px; text-align: center; }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .topbar {
            background: #0d1321;
            border-bottom: 1px solid #1e2a3a;
            padding: 12px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .currency-select {
            padding: 8px 14px;
            background: #131a2a;
            border: 1px solid #1e2a3a;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }
        .currency-select:focus { border-color: #00d4ff; }
        .regime-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: #131a2a;
            border-radius: 20px;
            font-size: 13px;
            color: #9ca3af;
        }
        .regime-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6b7280;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }
        .search-section {
            max-width: 800px;
            margin: 0 auto 32px;
            position: relative;
        }
        .search-box {
            display: flex;
            gap: 10px;
        }
        .search-input {
            flex: 1;
            padding: 14px 20px;
            font-size: 15px;
            background: #131a2a;
            border: 1px solid #1e2a3a;
            border-radius: 10px;
            color: #e0e0e0;
            outline: none;
        }
        .search-input:focus { border-color: #00d4ff; }
        .search-input::placeholder { color: #4b5563; }
        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #131a2a;
            border: 1px solid #1e2a3a;
            border-radius: 10px;
            margin-top: 4px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .search-dropdown.show { display: block; }
        .search-dropdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 1px solid #1e2a3a;
            transition: background 0.15s;
        }
        .search-dropdown-item:last-child { border-bottom: none; }
        .search-dropdown-item:hover { background: rgba(0,212,255,0.08); }
        .search-dropdown-item .sym { font-weight: 600; font-size: 14px; color: #e0e0e0; }
        .search-dropdown-item .name { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .search-dropdown-item .type {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .type-crypto { background: rgba(247,147,26,0.15); color: #f7931a; }
        .type-etf { background: rgba(251,146,60,0.15); color: #fb923c; }
        .type-forex { background: rgba(167,139,250,0.15); color: #a78bfa; }
        .type-commodities { background: rgba(34,197,94,0.15); color: #22c55e; }
        .type-stocks { background: rgba(0,212,255,0.15); color: #00d4ff; }
        .type-unknown { background: rgba(107,114,128,0.15); color: #9ca3af; }
        .search-btn {
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .search-btn:hover { opacity: 0.9; }
        .search-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .search-hint {
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
        }
        .quick-symbols {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .quick-symbol {
            padding: 5px 12px;
            background: #131a2a;
            border: 1px solid #1e2a3a;
            border-radius: 16px;
            font-size: 12px;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-symbol:hover { border-color: #00d4ff; color: #00d4ff; }
        .results {
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #131a2a;
            border: 1px solid #1e2a3a;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card h2 {
            font-size: 16px;
            margin-bottom: 14px;
            color: #f3f4f6;
        }
        .signal-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .signal-buy { background: rgba(34,197,94,0.15); color: #22c55e; }
        .signal-strong-buy { background: rgba(34,197,94,0.3); color: #22c55e; }
        .signal-sell { background: rgba(239,68,68,0.15); color: #ef4444; }
        .signal-strong-sell { background: rgba(239,68,68,0.3); color: #ef4444; }
        .signal-neutral { background: rgba(107,114,128,0.15); color: #9ca3af; }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }
        .metric-item {
            background: #0d1321;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
        }
        .metric-value {
            font-size: 22px;
            font-weight: 700;
            color: #00d4ff;
        }
        .metric-label {
            font-size: 10px;
            color: #6b7280;
            margin-top: 4px;
            text-transform: uppercase;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #1e2a3a;
        }
        th {
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
        }
        tr:hover { background: rgba(0,212,255,0.03); }
        .loading {
            text-align: center;
            padding: 60px;
            color: #6b7280;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #1e2a3a;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 12px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px;
            padding: 14px;
            color: #ef4444;
        }
        .prob-bar {
            width: 100%;
            height: 6px;
            background: #1e2a3a;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }
        .prob-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }
        .feature-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .feature-name {
            width: 180px;
            font-size: 12px;
            color: #9ca3af;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .feature-bar-bg {
            flex: 1;
            height: 8px;
            background: #1e2a3a;
            border-radius: 4px;
            overflow: hidden;
        }
        .feature-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            border-radius: 4px;
        }
        .feature-value {
            width: 60px;
            text-align: right;
            font-size: 12px;
            color: #6b7280;
        }
        .asset-specific {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .asset-item {
            background: #0d1321;
            padding: 14px;
            border-radius: 10px;
        }
        .asset-item .label {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .asset-item .value {
            font-size: 16px;
            font-weight: 600;
            color: #e0e0e0;
        }
        .asset-item .sub {
            font-size: 11px;
            color: #6b7280;
            margin-top: 4px;
        }
        .hidden { display: none; }
        .assistant-fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,212,255,0.4);
            z-index: 1000;
            transition: transform 0.2s;
        }
        .assistant-fab:hover { transform: scale(1.1); }
        .assistant-panel {
            position: fixed;
            bottom: 92px;
            right: 24px;
            width: 400px;
            max-height: 600px;
            background: #131a2a;
            border: 1px solid #1e2a3a;
            border-radius: 16px;
            display: none;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .assistant-panel.open { display: flex; }
        .assistant-header {
            padding: 16px 20px;
            border-bottom: 1px solid #1e2a3a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .assistant-header h3 { font-size: 15px; color: #f3f4f6; }
        .assistant-close {
            background: none;
            border: none;
            color: #6b7280;
            font-size: 20px;
            cursor: pointer;
        }
        .assistant-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .assistant-msg {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
        }
        .assistant-msg.user {
            background: rgba(0,212,255,0.1);
            align-self: flex-end;
            max-width: 85%;
        }
        .assistant-msg.bot {
            background: #0d1321;
            align-self: flex-start;
            max-width: 95%;
        }
        .assistant-input-area {
            padding: 12px 16px;
            border-top: 1px solid #1e2a3a;
            display: flex;
            gap: 8px;
        }
        .assistant-input {
            flex: 1;
            padding: 10px 14px;
            background: #0d1321;
            border: 1px solid #1e2a3a;
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 13px;
            outline: none;
        }
        .assistant-send {
            padding: 10px 16px;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        .algo-section {
            background: #0d1321;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .algo-section h3 {
            font-size: 13px;
            color: #00d4ff;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .algo-section p, .algo-section li {
            font-size: 13px;
            color: #9ca3af;
            line-height: 1.6;
        }
        .algo-section ul { padding-left: 20px; }
        .algo-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }
        body[data-tab="stocks"] { --accent: #00d4ff; --accent2: #7b2ff7; --card-bg: #131a2a; --metric-bg: #0d1321; }
        body[data-tab="crypto"] { --accent: #f7931a; --accent2: #ffd700; --card-bg: #1a1410; --metric-bg: #120e0a; }
        body[data-tab="commodities"] { --accent: #22c55e; --accent2: #84cc16; --card-bg: #0f1a14; --metric-bg: #0a120e; }
        body[data-tab="forex"] { --accent: #a78bfa; --accent2: #c084fc; --card-bg: #14101a; --metric-bg: #0e0a12; }
        body[data-tab="etf"] { --accent: #fb923c; --accent2: #fbbf24; --card-bg: #1a140f; --metric-bg: #120e0a; }
        body[data-tab="crypto"] .card { background: var(--card-bg); border-color: #2a2015; }
        body[data-tab="crypto"] .metric-item { background: var(--metric-bg); }
        body[data-tab="crypto"] .metric-value { color: var(--accent); }
        body[data-tab="crypto"] .search-btn { background: linear-gradient(135deg, #f7931a, #ffd700); }
        body[data-tab="crypto"] .nav-tab.active { color: var(--accent); border-left-color: var(--accent); background: rgba(247,147,26,0.1); }
        body[data-tab="crypto"] .nav-tab:hover { background: rgba(247,147,26,0.05); }
        body[data-tab="crypto"] .search-input:focus { border-color: var(--accent); }
        body[data-tab="crypto"] .quick-symbol:hover { border-color: var(--accent); color: var(--accent); }
        body[data-tab="crypto"] .feature-bar-fill { background: linear-gradient(90deg, #f7931a, #ffd700); }
        body[data-tab="crypto"] .prob-fill { background: var(--accent) !important; }
        body[data-tab="crypto"] .asset-item { background: var(--metric-bg); }
        body[data-tab="commodities"] .card { background: var(--card-bg); border-color: #152a1a; }
        body[data-tab="commodities"] .metric-item { background: var(--metric-bg); }
        body[data-tab="commodities"] .metric-value { color: var(--accent); }
        body[data-tab="commodities"] .search-btn { background: linear-gradient(135deg, #22c55e, #84cc16); }
        body[data-tab="commodities"] .nav-tab.active { color: var(--accent); border-left-color: var(--accent); background: rgba(34,197,94,0.1); }
        body[data-tab="commodities"] .nav-tab:hover { background: rgba(34,197,94,0.05); }
        body[data-tab="commodities"] .search-input:focus { border-color: var(--accent); }
        body[data-tab="commodities"] .quick-symbol:hover { border-color: var(--accent); color: var(--accent); }
        body[data-tab="commodities"] .feature-bar-fill { background: linear-gradient(90deg, #22c55e, #84cc16); }
        body[data-tab="commodities"] .prob-fill { background: var(--accent) !important; }
        body[data-tab="commodities"] .asset-item { background: var(--metric-bg); }
        body[data-tab="forex"] .card { background: var(--card-bg); border-color: #1a152a; }
        body[data-tab="forex"] .metric-item { background: var(--metric-bg); }
        body[data-tab="forex"] .metric-value { color: var(--accent); }
        body[data-tab="forex"] .search-btn { background: linear-gradient(135deg, #a78bfa, #c084fc); }
        body[data-tab="forex"] .nav-tab.active { color: var(--accent); border-left-color: var(--accent); background: rgba(167,139,250,0.1); }
        body[data-tab="forex"] .nav-tab:hover { background: rgba(167,139,250,0.05); }
        body[data-tab="forex"] .search-input:focus { border-color: var(--accent); }
        body[data-tab="forex"] .quick-symbol:hover { border-color: var(--accent); color: var(--accent); }
        body[data-tab="forex"] .feature-bar-fill { background: linear-gradient(90deg, #a78bfa, #c084fc); }
        body[data-tab="forex"] .prob-fill { background: var(--accent) !important; }
        body[data-tab="forex"] .asset-item { background: var(--metric-bg); }
        body[data-tab="etf"] .card { background: var(--card-bg); border-color: #2a1f15; }
        body[data-tab="etf"] .metric-item { background: var(--metric-bg); }
        body[data-tab="etf"] .metric-value { color: var(--accent); }
        body[data-tab="etf"] .search-btn { background: linear-gradient(135deg, #fb923c, #fbbf24); }
        body[data-tab="etf"] .nav-tab.active { color: var(--accent); border-left-color: var(--accent); background: rgba(251,146,60,0.1); }
        body[data-tab="etf"] .nav-tab:hover { background: rgba(251,146,60,0.05); }
        body[data-tab="etf"] .search-input:focus { border-color: var(--accent); }
        body[data-tab="etf"] .quick-symbol:hover { border-color: var(--accent); color: var(--accent); }
        body[data-tab="etf"] .feature-bar-fill { background: linear-gradient(90deg, #fb923c, #fbbf24); }
        body[data-tab="etf"] .prob-fill { background: var(--accent) !important; }
        body[data-tab="etf"] .asset-item { background: var(--metric-bg); }
    </style>
</head>
<body data-tab="stocks">
    <div class="sidebar">
        <div class="sidebar-brand">
            <h1>AI Trading</h1>
            <div class="subtitle">Predictor Engine v3</div>
        </div>
        <div class="nav-tab active" onclick="switchTab('stocks', this)">
            <span class="icon">&#128200;</span> Stocks
        </div>
        <div class="nav-tab" onclick="switchTab('crypto', this)">
            <span class="icon">&#9889;</span> Crypto
        </div>
        <div class="nav-tab" onclick="switchTab('commodities', this)">
            <span class="icon">&#128178;</span> Commodities
        </div>
        <div class="nav-tab" onclick="switchTab('forex', this)">
            <span class="icon">&#128177;</span> Forex
        </div>
        <div class="nav-tab" onclick="switchTab('etf', this)">
            <span class="icon">&#128202;</span> ETF
        </div>
    </div>

    <div class="main">
        <div class="topbar">
            <div class="topbar-left">
                <select class="currency-select" id="currencySelect" onchange="onCurrencyChange()">
                    <option value="USD">USD $</option>
                    <option value="EUR">EUR &euro;</option>
                    <option value="GBP">GBP &pound;</option>
                    <option value="JPY">JPY &yen;</option>
                    <option value="CNY">CNY &yen;</option>
                    <option value="KRW">KRW &#8361;</option>
                    <option value="INR">INR &#8377;</option>
                    <option value="CAD">CAD C$</option>
                    <option value="AUD">AUD A$</option>
                    <option value="CHF">CHF Fr</option>
                    <option value="SGD">SGD S$</option>
                    <option value="HKD">HKD HK$</option>
                    <option value="BRL">BRL R$</option>
                    <option value="MXN">MXN MX$</option>
                </select>
                <div class="regime-badge">
                    <div class="regime-dot" id="regimeDot"></div>
                    <span id="regimeText">Loading...</span>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="search-section">
                <div class="search-box">
                    <div style="flex:1;position:relative;">
                        <input type="text" class="search-input" id="searchInput"
                               placeholder="Search any stock, ETF, crypto, or forex..." autocomplete="off"
                               oninput="onSearchInput(this.value)" onfocus="onSearchFocus(this.value)">
                        <div class="search-dropdown" id="searchDropdown"></div>
                    </div>
                    <button class="search-btn" id="searchBtn" onclick="analyze()">Analyze</button>
                </div>
                <div class="search-hint" id="searchHint">Search any ticker on yfinance. Try AAPL, BTC-USD, SPY, EURUSD=X, GC=F</div>
                <div class="quick-symbols" id="quickSymbols"></div>
            </div>

            <div class="results" id="results"></div>
        </div>
    </div>

    <button class="assistant-fab" id="assistantFab" onclick="toggleAssistant()">&#129302;</button>
    <div class="assistant-panel" id="assistantPanel">
        <div class="assistant-header">
            <h3>AI Trading Assistant</h3>
            <div>
                <button class="assistant-close" onclick="clearAssistantChat()" title="Clear chat" style="margin-right:8px;">&#8635;</button>
                <button class="assistant-close" onclick="toggleAssistant()">&times;</button>
            </div>
        </div>
        <div class="assistant-messages" id="assistantMessages">
            <div class="assistant-msg bot">Hello! I can help you understand the analysis. Ask me about predictions, risk, features, or trading recommendations.</div>
        </div>
        <div class="assistant-input-area">
            <input type="text" class="assistant-input" id="assistantInput"
                   placeholder="Ask about the analysis..."
                   onkeypress="if(event.key==='Enter')sendMessage()">
            <button class="assistant-send" onclick="sendMessage()">&#10148;</button>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let currentTab = 'stocks';
        let currentCurrency = 'USD';

        const TAB_CONFIG = {
            stocks: {
                quick: ['AAPL','MSFT','NVDA','TSLA','GOOGL','AMZN','META','AMD'],
                hint: 'Search any stock ticker. Try AAPL, MSFT, NVDA, TSLA...',
                placeholder: 'Search stocks...'
            },
            crypto: {
                quick: ['BTC','ETH','SOL','BNB','XRP','ADA','DOGE','DOT'],
                hint: 'Search any cryptocurrency. Try BTC, ETH, SOL, BNB...',
                placeholder: 'Search crypto...'
            },
            commodities: {
                quick: ['GOLD','SILVER','OIL','NATGAS','COPPER','PLATINUM','WHEAT','CORN'],
                hint: 'Search any commodity. Try GOLD, OIL, NATGAS, COPPER...',
                placeholder: 'Search commodities...'
            },
            forex: {
                quick: ['EURUSD','GBPUSD','USDJPY','USDCHF','USDCAD','AUDUSD','USDCNY','USDINR'],
                hint: 'Search any forex pair. Try EURUSD, GBPUSD, USDJPY...',
                placeholder: 'Search forex...'
            },
            etf: {
                quick: ['SPY','QQQ','IWM','VTI','GLD','TLT','HYG','EEM'],
                hint: 'Search any ETF. Try SPY, QQQ, VTI, GLD, TLT...',
                placeholder: 'Search ETFs...'
            }
        };

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const dropdown = document.getElementById('searchDropdown');
                if (dropdown.classList.contains('show') && dropdown.children.length > 0) {
                    selectSymbol(dropdown.children[0].dataset.symbol);
                } else {
                    analyze();
                }
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-section')) {
                document.getElementById('searchDropdown').classList.remove('show');
            }
        });

        let searchTimeout;
        async function onSearchInput(value) {
            clearTimeout(searchTimeout);
            if (!value || value.length < 1) {
                document.getElementById('searchDropdown').classList.remove('show');
                return;
            }
            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(value)}`);
                    const data = await res.json();
                    renderSearchDropdown(data);
                } catch (e) {
                    document.getElementById('searchDropdown').classList.remove('show');
                }
            }, 200);
        }

        async function onSearchFocus(value) {
            if (value && value.length >= 1) {
                try {
                    const res = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(value)}`);
                    const data = await res.json();
                    renderSearchDropdown(data);
                } catch (e) {}
            }
        }

        function renderSearchDropdown(results) {
            const dropdown = document.getElementById('searchDropdown');
            if (!results || results.length === 0) {
                dropdown.classList.remove('show');
                return;
            }
            dropdown.innerHTML = results.map(r => `
                <div class="search-dropdown-item" data-symbol="${r.symbol}" onclick="selectSymbol('${r.symbol}')">
                    <div>
                        <div class="sym">${r.symbol}</div>
                        <div class="name">${r.name || r.symbol}</div>
                    </div>
                    <span class="type type-${r.asset_class || 'unknown'}">${r.asset_class || 'unknown'}</span>
                </div>
            `).join('');
            dropdown.classList.add('show');
        }

        function selectSymbol(symbol) {
            document.getElementById('searchInput').value = symbol;
            document.getElementById('searchDropdown').classList.remove('show');
            analyze();
        }

        function switchTab(tab, el) {
            currentTab = tab;
            document.body.setAttribute('data-tab', tab);
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            const cfg = TAB_CONFIG[tab];
            document.getElementById('searchInput').placeholder = cfg.placeholder;
            document.getElementById('searchHint').textContent = cfg.hint;
            const qs = document.getElementById('quickSymbols');
            qs.innerHTML = cfg.quick.map(s => `<span class="quick-symbol" onclick="quickSearch('${s}')">${s}</span>`).join('');
            document.getElementById('results').innerHTML = '';
        }

        function quickSearch(symbol) {
            document.getElementById('searchInput').value = symbol;
            analyze();
        }

        async function loadMarketState() {
            try {
                const res = await fetch(`${API_BASE}/api/market_state`);
                const data = await res.json();
                document.getElementById('regimeText').textContent = data.regime.replace(/_/g, ' ');
                const colors = {
                    crisis: '#ef4444', high_vol: '#f97316', trending_down: '#f59e0b',
                    ranging: '#6b7280', trending_up: '#22c55e', low_vol: '#00d4ff'
                };
                document.getElementById('regimeDot').style.background = colors[data.regime] || '#6b7280';
            } catch (e) {
                document.getElementById('regimeText').textContent = 'Unavailable';
            }
        }

        function onCurrencyChange() {
            currentCurrency = document.getElementById('currencySelect').value;
        }

        async function analyze() {
            const symbol = document.getElementById('searchInput').value.trim().toUpperCase();
            if (!symbol) return;

            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.textContent = 'Analyzing...';

            const results = document.getElementById('results');
            results.innerHTML = '<div class="loading">Running AI analysis</div>';

            try {
                const res = await fetch(`${API_BASE}/api/analyze/${symbol}?asset_class=${currentTab}&currency=${currentCurrency}`);
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Analysis failed');
                }
                const data = await res.json();
                renderResults(data);
            } catch (e) {
                results.innerHTML = `<div class="error">Error: ${e.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Analyze';
            }
        }

        async function loadAdvancedAnalytics(symbol) {
            try {
                const res = await fetch(`${API_BASE}/api/advanced/${symbol}?asset_class=${currentTab}`);
                if (!res.ok) return null;
                return await res.json();
            } catch (e) {
                return null;
            }
        }

        function renderAdvancedAnalytics(adv) {
            if (!adv) return '';
            const rm = adv.risk_metrics || {};
            const mc = adv.monte_carlo || {};
            const conf = adv.prediction_confidence || {};
            const div = adv.ensemble_diversity || {};
            const shap = adv.shap_values || [];

            return `
                <div class="card">
                    <h2>Risk Metrics</h2>
                    <div class="metrics-grid">
                        <div class="metric-item"><div class="metric-value">${((rm.sharpe || 0)).toFixed(2)}</div><div class="metric-label">Sharpe</div></div>
                        <div class="metric-item"><div class="metric-value">${((rm.sortino || 0)).toFixed(2)}</div><div class="metric-label">Sortino</div></div>
                        <div class="metric-item"><div class="metric-value">${((rm.max_drawdown || 0) * 100).toFixed(1)}%</div><div class="metric-label">Max DD</div></div>
                        <div class="metric-item"><div class="metric-value">${((rm.calmar || 0)).toFixed(2)}</div><div class="metric-label">Calmar</div></div>
                        <div class="metric-item"><div class="metric-value">${((rm.var_95 || 0) * 100).toFixed(2)}%</div><div class="metric-label">VaR 95%</div></div>
                        <div class="metric-item"><div class="metric-value">${((rm.cvar_95 || 0) * 100).toFixed(2)}%</div><div class="metric-label">CVaR 95%</div></div>
                        <div class="metric-item"><div class="metric-value">${((rm.skewness || 0)).toFixed(2)}</div><div class="metric-label">Skewness</div></div>
                        <div class="metric-item"><div class="metric-value">${((rm.kurtosis || 0)).toFixed(2)}</div><div class="metric-label">Kurtosis</div></div>
                    </div>
                </div>
                <div class="card">
                    <h2>Monte Carlo Simulation (500 paths)</h2>
                    <div class="metrics-grid">
                        <div class="metric-item"><div class="metric-value">${((mc.mean_final_return || 0) * 100).toFixed(1)}%</div><div class="metric-label">Mean Return</div></div>
                        <div class="metric-item"><div class="metric-value">${((mc.median_final_return || 0) * 100).toFixed(1)}%</div><div class="metric-label">Median</div></div>
                        <div class="metric-item"><div class="metric-value">${((mc.prob_profit || 0) * 100).toFixed(0)}%</div><div class="metric-label">P(Profit)</div></div>
                        <div class="metric-item"><div class="metric-value">${((mc.var || 0) * 100).toFixed(1)}%</div><div class="metric-label">VaR</div></div>
                        <div class="metric-item"><div class="metric-value">${((mc.cvar || 0) * 100).toFixed(1)}%</div><div class="metric-label">CVaR</div></div>
                        <div class="metric-item"><div class="metric-value">${((mc.percentile_5 || 0) * 100).toFixed(1)}%</div><div class="metric-label">5th Percentile</div></div>
                        <div class="metric-item"><div class="metric-value">${((mc.percentile_95 || 0) * 100).toFixed(1)}%</div><div class="metric-label">95th Percentile</div></div>
                    </div>
                </div>
                <div class="card">
                    <h2>Prediction Confidence</h2>
                    <div class="metrics-grid">
                        <div class="metric-item"><div class="metric-value">${((conf.mean_confidence || 0) * 100).toFixed(0)}%</div><div class="metric-label">Mean Confidence</div></div>
                        <div class="metric-item"><div class="metric-value">${((conf.high_confidence_ratio || 0) * 100).toFixed(0)}%</div><div class="metric-label">High Confidence</div></div>
                        <div class="metric-item"><div class="metric-value">${((conf.prediction_entropy || 0)).toFixed(3)}</div><div class="metric-label">Entropy</div></div>
                        <div class="metric-item"><div class="metric-value">${((div.diversity || 0)).toFixed(3)}</div><div class="metric-label">Ensemble Diversity</div></div>
                        <div class="metric-item"><div class="metric-value">${((div.agreement || 0) * 100).toFixed(0)}%</div><div class="metric-label">Model Agreement</div></div>
                    </div>
                </div>
                ${shap.length > 0 ? `
                <div class="card">
                    <h2>SHAP Feature Importance</h2>
                    ${shap.slice(0, 10).map(s => `
                        <div class="feature-bar">
                            <div class="feature-name">${s.feature}</div>
                            <div class="feature-bar-bg"><div class="feature-bar-fill" style="width:${(s.shap_importance / shap[0].shap_importance * 100).toFixed(1)}%;"></div></div>
                            <div class="feature-value">${s.shap_importance.toFixed(4)}</div>
                        </div>
                    `).join('')}
                </div>` : ''}
            `;
        }

        function renderResults(data) {
            const results = document.getElementById('results');
            const primaryPred = data.predictions.find(p => p.horizon === 5) || data.predictions[0];
            const signal = data.signals[0] || {};
            const metrics = data.metrics.find(m => m.horizon === 5) || data.metrics[0] || {};
            const marketState = data.market_state || {};
            const ccy = data.currency_symbol || '$';

            const signalClass = (signal.signal || 'NEUTRAL').toLowerCase().replace('_', '-');
            const prob = primaryPred ? primaryPred.probability_up : 0.5;
            const probPct = (prob * 100).toFixed(1);
            const probColor = prob > 0.5 ? '#22c55e' : '#ef4444';

            const maxImp = data.feature_importance.length > 0
                ? Math.max(...data.feature_importance.map(f => Math.abs(f.importance)))
                : 1;

            let assetSpecificHtml = '';
            if (data.asset_specific && Object.keys(data.asset_specific).length > 0) {
                const items = Object.entries(data.asset_specific).map(([k, v]) => {
                    if (typeof v === 'object') {
                        return Object.entries(v).map(([k2, v2]) => `
                            <div class="asset-item">
                                <div class="label">${k2.replace(/_/g, ' ')}</div>
                                <div class="value">${v2}</div>
                            </div>
                        `).join('');
                    }
                    return `<div class="asset-item"><div class="label">${k.replace(/_/g, ' ')}</div><div class="value">${v}</div></div>`;
                }).join('');
                const titleMap = { crypto: 'Crypto Indicators', forex: 'Forex Indicators', commodities: 'Commodity Indicators', etf: 'ETF Indicators' };
                assetSpecificHtml = `<div class="card"><h2>${titleMap[data.asset_class] || 'Asset Indicators'}</h2><div class="asset-specific">${items}</div></div>`;
            }

            results.innerHTML = `
                <div class="card">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
                        <div>
                            <h2 style="font-size:22px;">${data.symbol}</h2>
                            <div style="color:#6b7280;font-size:12px;margin-top:2px;">
                                ${primaryPred ? new Date(primaryPred.date).toLocaleDateString() : ''} | ${data.currency}
                            </div>
                        </div>
                        <span class="signal-badge signal-${signalClass}">${signal.signal || 'NEUTRAL'}</span>
                    </div>
                    <div style="display:flex;gap:32px;align-items:center;">
                        <div>
                            <div style="font-size:12px;color:#6b7280;">Probability Up</div>
                            <div style="font-size:32px;font-weight:700;color:${probColor};">${probPct}%</div>
                            <div class="prob-bar" style="width:180px;">
                                <div class="prob-fill" style="width:${probPct}%;background:${probColor};"></div>
                            </div>
                        </div>
                        <div>
                            <div style="font-size:12px;color:#6b7280;">Expected Return</div>
                            <div style="font-size:22px;font-weight:600;">${primaryPred ? (primaryPred.expected_return * 100).toFixed(2) : '0.00'}%</div>
                        </div>
                        <div>
                            <div style="font-size:12px;color:#6b7280;">Confidence</div>
                            <div style="font-size:22px;font-weight:600;">${primaryPred ? (primaryPred.confidence * 100).toFixed(0) : '0'}%</div>
                        </div>
                        <div>
                            <div style="font-size:12px;color:#6b7280;">Regime</div>
                            <div style="font-size:14px;font-weight:600;text-transform:capitalize;">${marketState.regime || 'unknown'}</div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <h2>Model Performance</h2>
                    <div class="metrics-grid">
                        <div class="metric-item"><div class="metric-value">${(metrics.auc * 100).toFixed(1)}%</div><div class="metric-label">AUC</div></div>
                        <div class="metric-item"><div class="metric-value">${(metrics.accuracy * 100).toFixed(1)}%</div><div class="metric-label">Accuracy</div></div>
                        <div class="metric-item"><div class="metric-value">${(metrics.precision * 100).toFixed(1)}%</div><div class="metric-label">Precision</div></div>
                        <div class="metric-item"><div class="metric-value">${(metrics.recall * 100).toFixed(1)}%</div><div class="metric-label">Recall</div></div>
                        <div class="metric-item"><div class="metric-value">${(metrics.brier).toFixed(3)}</div><div class="metric-label">Brier</div></div>
                        <div class="metric-item"><div class="metric-value">${(metrics.hit_rate * 100).toFixed(1)}%</div><div class="metric-label">Hit Rate</div></div>
                    </div>
                </div>
                ${assetSpecificHtml}
                <div id="advancedContainer"></div>
                <div class="card">
                    <h2>Multi-Horizon Predictions</h2>
                    <table>
                        <thead><tr><th>Horizon</th><th>Prob Up</th><th>Exp Return</th><th>Confidence</th><th>Uncertainty</th></tr></thead>
                        <tbody>
                            ${data.predictions.map(p => `
                                <tr>
                                    <td>${p.horizon}d</td>
                                    <td style="color:${p.probability_up > 0.5 ? '#22c55e' : '#ef4444'};">${(p.probability_up * 100).toFixed(1)}%</td>
                                    <td>${(p.expected_return * 100).toFixed(2)}%</td>
                                    <td>${(p.confidence * 100).toFixed(0)}%</td>
                                    <td>${(p.uncertainty * 100).toFixed(1)}%</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                <div class="card">
                    <h2>Top Feature Importance</h2>
                    ${data.feature_importance.slice(0, 15).map(f => `
                        <div class="feature-bar">
                            <div class="feature-name">${f.feature}</div>
                            <div class="feature-bar-bg"><div class="feature-bar-fill" style="width:${(Math.abs(f.importance) / maxImp * 100).toFixed(1)}%;"></div></div>
                            <div class="feature-value">${f.importance.toFixed(4)}</div>
                        </div>
                    `).join('')}
                </div>
            `;

            loadAdvancedAnalytics(data.symbol).then(adv => {
                if (adv) {
                    document.getElementById('advancedContainer').innerHTML = renderAdvancedAnalytics(adv);
                }
            });
            window._lastAnalysisContext = data;
            loadAlgorithmAnalysis(data.symbol).then(analysis => {
                if (analysis) {
                    const container = document.getElementById('advancedContainer');
                    container.innerHTML = renderAlgorithmAnalysis(analysis) + container.innerHTML;
                }
            });
        }

        function renderMarkdown(text) {
            if (!text) return '';
            return text
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }

        function clearAssistantChat() {
            const messagesEl = document.getElementById('assistantMessages');
            messagesEl.innerHTML = '<div class="assistant-msg bot">Chat cleared. How can I help you with the analysis?</div>';
        }

        function toggleAssistant() {
            document.getElementById('assistantPanel').classList.toggle('open');
            const messagesEl = document.getElementById('assistantMessages');
            if (messagesEl.innerHTML.includes('null')) {
                clearAssistantChat();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('assistantInput');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            const messagesEl = document.getElementById('assistantMessages');
            messagesEl.innerHTML += `<div class="assistant-msg user">${renderMarkdown(msg)}</div>`;
            messagesEl.scrollTop = messagesEl.scrollHeight;
            try {
                const context = window._lastAnalysisContext || {};
                const res = await fetch(`${API_BASE}/api/assistant`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: msg, context}),
                });
                const data = await res.json();
                const answer = data.answer || 'No response received. Please try again.';
                messagesEl.innerHTML += `<div class="assistant-msg bot">${renderMarkdown(answer)}</div>`;
            } catch (e) {
                messagesEl.innerHTML += `<div class="assistant-msg bot">Error: ${e.message}</div>`;
            }
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function loadAlgorithmAnalysis(symbol) {
            try {
                const res = await fetch(`${API_BASE}/api/algorithm_analysis/${symbol}?asset_class=${currentTab}`);
                if (!res.ok) return null;
                return await res.json();
            } catch (e) {
                return null;
            }
        }

        function renderAlgorithmAnalysis(analysis) {
            if (!analysis) return '';
            const recs = analysis.actionable_recommendations || [];
            return `
                <div class="card">
                    <h2>Algorithm Analysis</h2>
                    <div class="algo-section">
                        <h3>Summary</h3>
                        <p>${analysis.summary || ''}</p>
                    </div>
                    <div class="algo-section">
                        <h3>Signal Breakdown</h3>
                        <p><strong>${analysis.signal_breakdown?.interpretation || 'N/A'}</strong> — Score: ${(analysis.signal_breakdown?.score || 0).toFixed(3)}</p>
                    </div>
                    <div class="algo-section">
                        <h3>Model Quality</h3>
                        <p>AUC: ${((analysis.model_performance?.auc || 0) * 100).toFixed(1)}% — ${analysis.model_performance?.auc_quality || 'N/A'}</p>
                        <p>Calibration: ${analysis.model_performance?.brier_quality || 'N/A'}</p>
                    </div>
                    <div class="algo-section">
                        <h3>Top Feature Drivers</h3>
                        <p>${analysis.feature_drivers?.top_driver || 'N/A'} (importance: ${(analysis.feature_drivers?.top_driver_importance || 0).toFixed(4)})</p>
                        <p>${analysis.feature_drivers?.diversification || ''}</p>
                    </div>
                    <div class="algo-section">
                        <h3>Risk Assessment</h3>
                        <p>Position Size: <strong>${analysis.risk_assessment?.position_size_recommendation || 'N/A'}</strong></p>
                        <p>${analysis.risk_assessment?.regime_warning || ''}</p>
                    </div>
                    <div class="algo-section">
                        <h3>Recommendations</h3>
                        <ul>${recs.map(r => `<li>${r}</li>`).join('')}</ul>
                    </div>
                    <div class="algo-section">
                        <h3>Confidence Explanation</h3>
                        <p>${analysis.confidence_explanation?.explanation || 'N/A'}</p>
                    </div>
                </div>
            `;
        }

        loadMarketState();
        switchTab('stocks', document.querySelector('.nav-tab'));
    </script>
</body>
</html>
