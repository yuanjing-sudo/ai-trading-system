name: Cloud Data Snapshot

on:
  schedule:
    - cron: "17 22 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated tickers (default: built-in universe)"
        required: false
        default: ""
      model:
        description: "GitHub Models model id (default: openai/gpt-4o-mini)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write
  models: read

concurrency:
  group: cloud-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Probe GitHub Models endpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -sS -i -X POST https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Say OK"}],"max_tokens":5}' | head -c 700
          echo

      - name: Generate cloud snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_MODELS_MODEL: ${{ github.event.inputs.model || vars.GITHUB_MODELS_MODEL || 'openai/gpt-4o-mini' }}
          GITHUB_MODELS_DEBUG: "1"
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            python scripts/cloud_snapshot.py --tickers ${{ github.event.inputs.tickers }}
          else
            python scripts/cloud_snapshot.py
          fi

      - name: Commit snapshot to repository (free cloud storage)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/snapshots
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: cloud data snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Trigger Pages deploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages.yml',
              ref: 'master'
            });
